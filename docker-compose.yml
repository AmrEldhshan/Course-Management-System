version: "3.9"

services:
  db:
    image: postgres:16
    container_name: cms_db
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    build: ./admin
    container_name: cms_admin
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  public:
    build: ./public
    container_name: cms_public
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cms_frontend
    ports:
      - "3000:80"
    depends_on:
      - admin
      - public

volumes:
  pgdata: